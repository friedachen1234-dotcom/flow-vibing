<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="400" height="300" rx="18" fill="#FFFDF8"/><text x="40" y="90" font-family="Georgia, serif" font-size="30" fill="#1F1A17">Halve the lemons,</text><text x="40" y="132" font-family="Georgia, serif" font-size="30" fill="#1F1A17">squeeze one over the</text><text x="40" y="174" font-family="Georgia, serif" font-size="30" fill="#1F1A17">tray, tuck the halves</text><text x="40" y="216" font-family="Georgia, serif" font-size="30" fill="#1F1A17">between the chicken.</text><rect x="40" y="242" width="96" height="30" rx="15" fill="#F7F1E6"/><text x="88" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#1F1A17">2 lemons</text></svg>